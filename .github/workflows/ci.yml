name: SnoopAR Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  core-build-and-test:
    name: Core C++20 & Simulation Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r simulation/requirements.txt

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: cmake -B core/build -S core -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: cmake -B core/build -S core -G "Visual Studio 17 2022" -A x64

      - name: Build Core C++ Library & Tests
        run: cmake --build core/build --config Release

      - name: Run Core Test Suite
        working-directory: core/build
        run: ctest --output-on-failure -C Release

      - name: Run Pre-Recorded Benchmark Dataset Evaluator
        run: python simulation/evaluate_datasets.py

      - name: Run Monte Carlo Benchmark
        run: python simulation/benchmark_snoopar.py
